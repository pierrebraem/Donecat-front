on:
    push:
        branches:
            - main
            - dev
            - 0.1.X
            - test_sonarqube
    pull_request:
        types: [opened, reopened]

name: Github Action
jobs:
    sonarqube:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}