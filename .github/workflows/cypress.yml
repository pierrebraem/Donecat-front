name: Cypress Tests

on:
    push:
        branches:
            - main
            - 0.1.X
            - dev
    
    pull_request:
        types: [opened, reopened]
jobs:
    cypress:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Cypress Tests
              uses: cypress-io/github-action@v6
              with:
                build: npm run build
                start: npm run preview