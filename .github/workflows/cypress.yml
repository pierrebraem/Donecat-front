name: Cypress Tests

on:    
    pull_request:
        types: [opened, synchronize, reopened]
jobs:
    cypress:
        runs-on: ubuntu-24.04
        env:
            CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Run Cypress Tests
              uses: cypress-io/github-action@v6
              with:
                build: npm run build
                start: npm run preview